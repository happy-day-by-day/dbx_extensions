name: Release database documentation plugin

on:
  push:
    branches: [main]
    paths:
      - dbx-dbdoc/manifest.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-dbdoc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbx-dbdoc
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dbx-dbdoc/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - uses: dtolnay/rust-toolchain@1.90.0
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:backend
      - run: npm run build
      - name: Package plugin
        run: npm run package
      - run: npm run verify:package
      - name: Verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          PACKAGE="dist/com.sazs.dbdoc-${VERSION}-universal.dbxp"
          METADATA="dist/com.sazs.dbdoc-${VERSION}-universal.artifact.json"
          node --input-type=module - "$PACKAGE" "$METADATA" <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const [packagePath, metadataPath] = process.argv.slice(2);
          const bytes = fs.readFileSync(packagePath);
          const metadata = JSON.parse(fs.readFileSync(metadataPath, 'utf8'));
          const sha256 = crypto.createHash('sha256').update(bytes).digest('hex');
          if (sha256 !== metadata.sha256 || bytes.length !== metadata.size) {
            throw new Error('Package checksum or size does not match artifact metadata');
          }
          NODE
          gh release create "v${VERSION}" "$PACKAGE" "$METADATA" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "数据库文档 v${VERSION}" \
            --notes-file "docs/release-notes-${VERSION}.md"
